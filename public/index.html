<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- 홈 화면에 추가했을 때 앱처럼 열리게 하는 설정과 아이콘 -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수학 선생님">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<title>수학 선생님</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" onload="rerenderAll()"></script>
<style>
  .actions { display: flex; gap: 8px; }
  .actions a { text-decoration: none; }
  .msg { margin: 0 0 28px; }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .msg.user .bubble {
    background: var(--user-bg);
    border-radius: 18px 18px 4px 18px;
    padding: 10px 14px;
    max-width: 85%;
    font-size: 16px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }
  .photos { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; max-width: 85%; }
  .photos img {
    max-width: min(320px, 100%);
    max-height: 320px;
    border-radius: 14px;
    border: 1px solid var(--line);
    display: block;
    cursor: zoom-in;
  }
  .photos.many img { max-width: 150px; max-height: 150px; object-fit: cover; }
  .status { color: var(--muted); font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  .note { color: var(--err); font-size: 14px; margin-top: 6px; }
  footer {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--bg) 70%, transparent);
    padding: 8px 0 calc(12px + env(safe-area-inset-bottom));
  }
  #composer { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  .attach { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 10px; padding-top: 8px; }
  .thumb { position: relative; }
  .thumb img { height: 72px; border-radius: 10px; border: 1px solid var(--line); display: block; cursor: zoom-in; }
  .thumb button {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: none;
    background: var(--fg);
    color: var(--bg);
    font-size: 15px;
    line-height: 24px;
    cursor: pointer;
    padding: 0;
  }
  .row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 6px;
  }
  .icon-btn, .send {
    flex: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
    border: none;
  }
  .icon-btn { background: transparent; color: var(--muted); }
  .icon-btn.off { opacity: 0.35; pointer-events: none; }
  .send { background: var(--accent); color: var(--accent-fg); }
  .send:disabled { opacity: 0.35; cursor: default; }
  .send.stop { background: var(--fg); color: var(--bg); }
  .send .icon-stop, .send.stop .icon-send { display: none; }
  .send.stop .icon-stop { display: block; }
  textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 16px;
    line-height: 1.5;
    padding: 9px 4px;
    max-height: 180px;
  }
  textarea::placeholder { color: var(--muted); }
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(0, 0, 0, 0.9);
    display: grid;
    place-items: center;
    overflow: auto;
    cursor: zoom-out;
  }
  .lightbox img { max-width: 100vw; max-height: 100dvh; object-fit: contain; display: block; }
  .left { display: flex; align-items: center; gap: 4px; }
  .menu-btn {
    width: 36px;
    height: 36px;
    margin-left: -8px;
    border: none;
    border-radius: 10px;
    background: transparent;
    color: var(--fg);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.35); }
  .drawer {
    position: fixed;
    top: 0;
    bottom: 0;
    left: 0;
    z-index: 21;
    width: min(320px, 86vw);
    background: var(--card);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
  }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
  .drawer-head strong { font-size: 17px; }
  .new-chat {
    font: inherit;
    font-size: 15px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--bg);
    color: var(--fg);
    text-align: left;
    cursor: pointer;
    margin-bottom: 10px;
  }
  #conv-list { flex: 1; overflow-y: auto; margin: 0 -4px; }
  .conv {
    display: block;
    width: 100%;
    text-align: left;
    font: inherit;
    border: none;
    background: transparent;
    color: var(--fg);
    padding: 10px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .conv:hover, .conv.current { background: var(--user-bg); }
  .conv-title {
    font-size: 15px;
    line-height: 1.45;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
  }
  .conv-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .drawer-note { color: var(--muted); font-size: 14px; padding: 8px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="left">
      <button id="menu" class="menu-btn" type="button" aria-label="대화 목록" hidden>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1>수학 선생님</h1>
    </div>
    <div class="actions">
      <button id="reset" class="ghost" type="button" hidden>새 대화</button>
    </div>
  </div>
</header>

<div id="backdrop" class="backdrop" hidden></div>
<aside id="drawer" class="drawer" aria-label="대화 목록" hidden>
  <div class="drawer-head">
    <strong>대화</strong>
    <button id="drawer-close" class="ghost" type="button">닫기</button>
  </div>
  <button id="drawer-new" class="new-chat" type="button">+ 새 대화</button>
  <nav id="conv-list"></nav>
</aside>

<section id="gate" class="gate" hidden>
  <form id="gate-form">
    <label for="code">입장 코드</label>
    <input id="code" type="password" autocomplete="off" required>
    <button type="submit">들어가기</button>
    <div id="gate-error" class="error-line" hidden></div>
  </form>
</section>

<main id="log" aria-live="polite" hidden></main>

<footer id="footer" hidden>
  <form id="composer">
    <div id="error" class="error-line" hidden></div>
    <div id="attach" class="attach" hidden></div>
    <div class="row">
      <label id="photo-btn" class="icon-btn" for="photo" title="사진 올리기">
        <span class="sr">사진 올리기</span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      </label>
      <input id="photo" class="sr" type="file" accept="image/*" multiple>
      <textarea id="input" rows="1" placeholder="문제나 사진을 보내 주세요"></textarea>
      <button id="send" class="send" type="submit" aria-label="보내기" disabled>
        <svg class="icon-send" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg class="icon-stop" width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect width="14" height="14" rx="2.5" fill="currentColor"/></svg>
      </button>
    </div>
  </form>
</footer>

<div id="lightbox" class="lightbox" hidden><img alt="크게 본 사진"></div>

<script src="/render.js"></script>
<script>
const CODE_KEY = "mt-code";
const CHAT_KEY = "mt-chat";
const MAX_PHOTOS = 4;
const log = document.getElementById("log");
const form = document.getElementById("composer");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const photoInput = document.getElementById("photo");
const photoBtn = document.getElementById("photo-btn");
const attach = document.getElementById("attach");
const errorLine = document.getElementById("error");
const resetBtn = document.getElementById("reset");
const lightbox = document.getElementById("lightbox");
const menuBtn = document.getElementById("menu");
const drawer = document.getElementById("drawer");
const backdrop = document.getElementById("backdrop");
const convList = document.getElementById("conv-list");
const coarse = matchMedia("(pointer: coarse)").matches;

let code = store.get(CODE_KEY);
let who = null;
let conversation = null;
// 한 대화의 주고받은 말. 사진은 이 창에서만 들고 있고, 저장할 때는 "사진이 몇 장 있었다"만 남긴다.
let turns = [];
let photos = [];
let busy = false;
let controller = null;

// ---------- 입장 ----------
async function enter() {
  try {
    const res = await fetch("/api/check", { headers: { "x-access-code": code || "" } });
    if (!res.ok) throw new Error(res.status === 401 ? "bad_code" : `서버 오류(${res.status})예요.`);
    who = (await res.json()).who;
  } catch (err) {
    store.remove(CODE_KEY);
    showGate(err.message === "bad_code" ? (code ? "코드가 맞지 않아요." : "") : err.message);
    return;
  }
  document.getElementById("gate").hidden = true;
  log.hidden = false;
  document.getElementById("footer").hidden = false;
  menuBtn.hidden = false;
  restore();
  input.focus();
  syncFromServer();
}

function showGate(message) {
  log.hidden = true;
  document.getElementById("footer").hidden = true;
  resetBtn.hidden = true;
  menuBtn.hidden = true;
  closeDrawer();
  document.getElementById("gate").hidden = false;
  const e = document.getElementById("gate-error");
  e.textContent = message || "";
  e.hidden = !message;
  document.getElementById("code").focus();
}

document.getElementById("gate-form").addEventListener("submit", (e) => {
  e.preventDefault();
  code = document.getElementById("code").value.trim();
  store.set(CODE_KEY, code);
  enter();
});

// ---------- 대화 저장·복원 ----------
const imageCount = (t) => t.images?.length || Number(t.hadImage) || 0;

function save() {
  store.set(CHAT_KEY, JSON.stringify({
    conversation,
    turns: turns.map((t) => ({ role: t.role, text: t.text, hadImage: imageCount(t), meta: t.meta })),
  }));
}

// 이 기기에 남겨 둔 지금 대화(글만)를 먼저 그리고, 사진까지 든 원본은 서버에서 받아 바꿔 그린다.
function restore() {
  let saved = null;
  try { saved = JSON.parse(store.get(CHAT_KEY) || "null"); } catch {}
  conversation = saved?.conversation || newId();
  showTurns(Array.isArray(saved?.turns) ? saved.turns : []);
}

function showTurns(list) {
  turns = list;
  log.innerHTML = "";
  for (const t of turns) {
    if (t.role === "user") {
      addUser(t.text, (t.images || []).map((p) => p.dataUrl), imageCount(t));
    } else {
      const ai = addAnswer();
      ai.set(t.text, true);
      if (t.meta) ai.meta.textContent = t.meta;
    }
  }
  resetBtn.hidden = !turns.length;
  scrollDown(true);
}

async function syncFromServer() {
  if (!turns.length) return;
  const id = conversation;
  const count = turns.length;
  const rows = await fetchConversation(id).catch(() => null);
  // 그사이 다른 대화로 옮겼거나 새로 물었으면 건드리지 않는다
  if (!rows?.length || busy || id !== conversation || turns.length !== count) return;
  showTurns(rowsToTurns(rows));
}

async function fetchConversation(id) {
  const res = await fetch(`/api/conversations?id=${encodeURIComponent(id)}`, { headers: { "x-access-code": code || "" } });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `서버 오류(${res.status})예요.`);
  return data.rows;
}

// 서버에 남은 질문 줄들을 화면의 주고받은 말로 바꾼다
function rowsToTurns(rows) {
  const list = [];
  for (const r of rows) {
    list.push({
      role: "user",
      text: r.question || "",
      images: (r.photos || []).map((p) => ({ type: p.type, data: p.data, dataUrl: `data:${p.type};base64,${p.data}` })),
      hadImage: r.has_image || 0,
    });
    list.push({ role: "assistant", text: r.answer, meta: r.status === "stopped" ? "중간에 멈춘 답이에요." : r.model ? savedMeta(r) : "" });
  }
  return list;
}

function savedMeta(r) {
  const n = (x) => (x || 0).toLocaleString("ko-KR");
  return `${r.model} · 입력 ${n(r.input_tokens)} · 캐시 읽기 ${n(r.cache_read_tokens)} · 캐시 쓰기 ${n(r.cache_write_tokens)} · 출력 ${n(r.output_tokens)} 토큰 · 약 $${(Number(r.cost_usd) || 0).toFixed(3)}`;
}

// ---------- 대화 목록 ----------
menuBtn.addEventListener("click", openDrawer);
backdrop.addEventListener("click", closeDrawer);
document.getElementById("drawer-close").addEventListener("click", closeDrawer);
document.getElementById("drawer-new").addEventListener("click", newConversation);

async function openDrawer() {
  drawer.hidden = false;
  backdrop.hidden = false;
  convList.innerHTML = `<div class="drawer-note">불러오는 중…</div>`;
  try {
    const res = await fetch("/api/conversations", { headers: { "x-access-code": code || "" } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `서버 오류(${res.status})예요.`);
    renderList(data.conversations);
  } catch (err) {
    convList.innerHTML = "";
    const note = document.createElement("div");
    note.className = "drawer-note";
    note.textContent = err.message;
    convList.append(note);
  }
}

function closeDrawer() {
  drawer.hidden = true;
  backdrop.hidden = true;
}

function renderList(list) {
  convList.innerHTML = "";
  if (!list.length) {
    convList.innerHTML = `<div class="drawer-note">아직 대화가 없어요.</div>`;
    return;
  }
  for (const c of list) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "conv" + (c.conversation === conversation ? " current" : "");
    const title = document.createElement("div");
    title.className = "conv-title";
    title.textContent = c.title || (c.has_image ? "사진으로 보낸 문제" : "제목 없는 대화");
    const sub = document.createElement("div");
    sub.className = "conv-sub";
    sub.textContent = `${dayLabel(c.updated)} · 질문 ${c.n}개 · 약 $${(Number(c.cost) || 0).toFixed(2)}`;
    b.append(title, sub);
    b.addEventListener("click", () => openConversation(c.conversation));
    convList.append(b);
  }
}

function dayLabel(utc) {
  return new Date(utc.replace(" ", "T") + "Z").toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul", month: "long", day: "numeric" });
}

async function openConversation(id) {
  closeDrawer();
  if (busy) {
    showError("답을 받는 중이에요. 멈추거나 끝난 뒤에 옮겨 주세요.");
    return;
  }
  showError("");
  log.innerHTML = `<div class="drawer-note">대화를 불러오는 중…</div>`;
  try {
    const rows = await fetchConversation(id);
    conversation = id;
    showTurns(rowsToTurns(rows));
    save();
  } catch (err) {
    restore();
    showError(err.message);
  }
}

function newConversation() {
  if (busy) return;
  conversation = newId();
  store.remove(CHAT_KEY);
  showTurns([]);
  showError("");
  closeDrawer();
  input.focus();
}

function newId() {
  return (crypto.randomUUID?.() || String(Date.now()) + Math.random().toString(16).slice(2)).replace(/[^\w-]/g, "");
}

// 서버로 보낼 대화. 복원된 대화의 사진은 남아 있지 않으니 글로 표시해 둔다.
function toMessages() {
  return turns.map((t) => {
    if (t.role === "assistant") return { role: "assistant", content: t.text };
    const content = [];
    if (t.images?.length) {
      for (const p of t.images) content.push({ type: "image", source: { type: "base64", media_type: p.type, data: p.data } });
    } else if (imageCount(t)) {
      content.push({ type: "text", text: "(앞에서 사진으로 보낸 문제)" });
    }
    if (t.text) content.push({ type: "text", text: t.text });
    return { role: "user", content };
  });
}

resetBtn.addEventListener("click", newConversation);

// ---------- 입력 ----------
function refreshSend() {
  sendBtn.classList.toggle("stop", busy);
  sendBtn.setAttribute("aria-label", busy ? "답 멈추기" : "보내기");
  sendBtn.disabled = !busy && !input.value.trim() && !photos.length;
  photoBtn.classList.toggle("off", photos.length >= MAX_PHOTOS);
}
function autosize() {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 180) + "px";
}
input.addEventListener("input", () => { autosize(); refreshSend(); });
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing && !coarse) {
    e.preventDefault();
    if (!busy) form.requestSubmit();
  }
});

photoInput.addEventListener("change", async () => {
  const files = [...photoInput.files];
  photoInput.value = "";
  const room = MAX_PHOTOS - photos.length;
  if (files.length > room) showError(`사진은 한 번에 ${MAX_PHOTOS}장까지 보낼 수 있어요.`);
  for (const file of files.slice(0, room)) {
    try {
      photos.push(await shrink(file));
    } catch {
      showError("사진을 읽지 못했어요. 다른 사진으로 해 주세요.");
    }
  }
  setPhotos(photos);
});

function setPhotos(list) {
  photos = list;
  attach.innerHTML = "";
  photos.forEach((p, i) => {
    const box = document.createElement("div");
    box.className = "thumb";
    const im = document.createElement("img");
    im.src = p.dataUrl;
    im.alt = `올린 사진 ${i + 1}`;
    im.addEventListener("click", () => openLightbox(p.dataUrl));
    const x = document.createElement("button");
    x.type = "button";
    x.textContent = "×";
    x.setAttribute("aria-label", "사진 빼기");
    x.addEventListener("click", () => setPhotos(photos.filter((_, j) => j !== i)));
    box.append(im, x);
    attach.append(box);
  });
  attach.hidden = !photos.length;
  refreshSend();
}

// 휴대폰 사진은 크니까 긴 변 1600px 로 줄여서 보낸다.
async function shrink(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
  return { dataUrl, data: dataUrl.split(",")[1], type: "image/jpeg" };
}

function showError(text) {
  errorLine.textContent = text;
  errorLine.hidden = !text;
}

// ---------- 사진 크게 보기 ----------
function openLightbox(src) {
  lightbox.querySelector("img").src = src;
  lightbox.hidden = false;
}
lightbox.addEventListener("click", () => { lightbox.hidden = true; });
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  lightbox.hidden = true;
  closeDrawer();
});

// ---------- 보내기·멈추기 ----------
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  // 답을 받는 중에는 같은 버튼이 "멈추기"다
  if (busy) {
    controller?.abort();
    return;
  }
  const text = input.value.trim();
  if (!text && !photos.length) return;

  const turn = { role: "user", text, images: photos };
  turns.push(turn);
  const userEl = addUser(text, photos.map((p) => p.dataUrl), 0);
  const ai = addAnswer();
  input.value = "";
  autosize();
  setPhotos([]);
  showError("");
  busy = true;
  controller = new AbortController();
  refreshSend();
  resetBtn.hidden = false;
  scrollDown(true);

  const started = Date.now();
  const tick = setInterval(() => {
    ai.statusText.textContent = `풀어 보는 중 · ${Math.round((Date.now() - started) / 1000)}초`;
  }, 1000);

  let answer = "";
  let note = "";
  let meta = "";
  try {
    const res = await fetch("/api/ask", {
      method: "POST",
      headers: { "content-type": "application/json", "x-access-code": code },
      body: JSON.stringify({ conversation, messages: toMessages() }),
      signal: controller.signal,
    });
    if (res.status === 401) throw Object.assign(new Error("코드가 바뀌었어요. 다시 넣어 주세요."), { gate: true });
    if (!res.ok || !res.body) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `서버 오류(${res.status})예요.`);
    }
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let nl;
      while ((nl = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, nl);
        buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.t === "text") {
          answer += ev.v;
          ai.status.hidden = true;
          ai.set(answer);
        } else if (ev.t === "error") {
          note = ev.message;
        } else if (ev.t === "done") {
          meta = metaText(ev, started);
          ai.meta.textContent = meta;
        }
      }
    }
    if (!answer) throw new Error(note || "답이 비어 있어요. 다시 보내 주세요.");
    turns.push({ role: "assistant", text: answer, meta });
    save();
    if (note) ai.note(note);
  } catch (err) {
    const stopped = err.name === "AbortError";
    if (stopped && answer) {
      // 멈춘 데까지의 답은 남겨 두고, 그대로 이어서 물을 수 있게 한다
      ai.set(answer, true);
      meta = "중간에 멈춘 답이에요.";
      ai.meta.textContent = meta;
      turns.push({ role: "assistant", text: answer, meta });
      save();
    } else {
      turns.pop();
      userEl.remove();
      ai.el.remove();
      input.value = turn.text;
      autosize();
      setPhotos(turn.images);
      if (!turns.length) resetBtn.hidden = true;
      if (err.gate) {
        store.remove(CODE_KEY);
        code = null;
        showGate(err.message);
      } else if (!stopped) {
        showError(err.message || "연결이 끊겼어요. 다시 보내 주세요.");
      }
    }
  } finally {
    clearInterval(tick);
    ai.status.hidden = true;
    busy = false;
    controller = null;
    refreshSend();
  }
});

function addUser(text, imgs, hadImage) {
  const el = document.createElement("div");
  el.className = "msg user";
  if (imgs.length) {
    const box = document.createElement("div");
    box.className = imgs.length > 1 ? "photos many" : "photos";
    for (const src of imgs) {
      const im = document.createElement("img");
      im.src = src;
      im.alt = "보낸 문제 사진";
      im.addEventListener("click", () => openLightbox(src));
      box.append(im);
    }
    el.append(box);
  } else if (hadImage) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = hadImage > 1 ? `사진 ${hadImage}장` : "사진";
    el.append(chip);
  }
  if (text) {
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    el.append(b);
  }
  log.append(el);
  return el;
}

function addAnswer() {
  const el = document.createElement("div");
  el.className = "msg ai";
  el.innerHTML = `<div class="status"><span class="dot"></span><span>풀어 보는 중</span></div><div class="answer"></div><div class="meta"></div>`;
  log.append(el);
  const answer = el.querySelector(".answer");
  let pending = null;
  let latest = "";
  const ai = {
    el,
    status: el.querySelector(".status"),
    statusText: el.querySelector(".status span:last-child"),
    meta: el.querySelector(".meta"),
    set(text, now) {
      latest = text;
      if (now) {
        clearTimeout(pending);
        pending = null;
        ai.status.hidden = true;
        paint(answer, text);
        return;
      }
      if (pending) return;
      pending = setTimeout(() => {
        pending = null;
        const near = isNearBottom();
        paint(answer, latest);
        if (near) scrollDown();
      }, 80);
    },
    note(text) {
      const n = document.createElement("div");
      n.className = "note";
      n.textContent = text;
      el.insertBefore(n, ai.meta);
    },
  };
  return ai;
}

// 답 아래에 붙는 토큰·비용 줄. 대화를 저장할 때 같이 남겨 새로고침 뒤에도 보인다.
function metaText(ev, started) {
  const u = ev.usage || {};
  const n = (x) => (x || 0).toLocaleString("ko-KR");
  const secs = Math.round((Date.now() - started) / 1000);
  return `${ev.model} · ${secs}초 · 입력 ${n(u.input_tokens)} · 캐시 읽기 ${n(u.cache_read_input_tokens)} · 캐시 쓰기 ${n(u.cache_creation_input_tokens)} · 출력 ${n(u.output_tokens)} 토큰 · 약 $${(ev.cost || 0).toFixed(3)}`;
}

function isNearBottom() {
  return window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
}
function scrollDown(force) {
  if (force || isNearBottom()) window.scrollTo({ top: document.body.scrollHeight });
}

refreshSend();
if (code) enter(); else showGate("");
</script>
