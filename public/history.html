<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<!-- 홈 화면에 추가했을 때 앱처럼 열리게 하는 설정과 아이콘 -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수학 선생님">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<title>지난 질문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" onload="rerenderAll()"></script>
<style>
  .day { font-size: 14px; font-weight: 700; color: var(--muted); margin: 28px 0 4px; }
  .day:first-child { margin-top: 0; }
  .item { border-bottom: 1px solid var(--line); padding: 14px 0; }
  .item-head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .item-q { font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 8px; }
  .item details summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-bottom: 8px; }
  .item .answer { font-size: 16px; }
  .empty { color: var(--muted); font-size: 15px; }
  .continue { margin-top: 10px; font-size: 13px; padding: 5px 12px; }
  .more { display: block; margin: 20px auto; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>지난 질문</h1>
    <a class="ghost" href="/" style="text-decoration:none">질문하러 가기</a>
  </div>
</header>

<main>
  <div id="error" class="error-line" hidden></div>
  <div id="list"></div>
  <button id="more" class="ghost more" type="button" hidden>더 보기</button>
</main>

<script src="/render.js"></script>
<script>
const code = store.get("mt-code");
const list = document.getElementById("list");
const more = document.getElementById("more");
const errorLine = document.getElementById("error");
let oldest = null;
let lastDay = null;

const toDate = (utc) => new Date(utc.replace(" ", "T") + "Z");
const dayLabel = (d) => d.toLocaleDateString("ko-KR", { timeZone: "Asia/Seoul", month: "long", day: "numeric", weekday: "short" });
const timeLabel = (d) => d.toLocaleTimeString("ko-KR", { timeZone: "Asia/Seoul", hour: "numeric", minute: "2-digit" });

async function load(before) {
  const res = await fetch("/api/records" + (before ? `?before=${before}` : ""), { headers: { "x-access-code": code || "" } });
  if (res.status === 401) {
    location.replace("/");
    return null;
  }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `서버 오류(${res.status})예요.`);
  return data.rows;
}

function showRows(rows) {
  for (const r of rows) {
    const when = toDate(r.created_at);
    const day = dayLabel(when);
    if (day !== lastDay) {
      const h = document.createElement("div");
      h.className = "day";
      h.textContent = day;
      list.append(h);
      lastDay = day;
    }

    const el = document.createElement("article");
    el.className = "item";
    const head = document.createElement("div");
    head.className = "item-head";
    head.innerHTML =
      `<span>${timeLabel(when)}</span>` +
      (r.has_image ? `<span class="chip">사진${r.has_image > 1 ? ` ${r.has_image}장` : ""}</span>` : "") +
      (r.status === "stopped" ? `<span>중간에 멈춘 답</span>` : "");
    el.append(head);

    const q = document.createElement("div");
    q.className = "item-q";
    q.textContent = r.question || "사진으로 보낸 문제";
    el.append(q);

    const d = document.createElement("details");
    d.innerHTML = "<summary>답 보기</summary>";
    const a = document.createElement("div");
    a.className = "answer";
    d.append(a);
    d.addEventListener("toggle", () => { if (d.open && !a.innerHTML) paint(a, r.answer); });
    el.append(d);

    if (r.model) {
      const m = document.createElement("div");
      m.className = "meta";
      m.textContent = metaLine(r);
      el.append(m);
    }

    const go = document.createElement("button");
    go.type = "button";
    go.className = "ghost continue";
    go.textContent = "이어서 묻기";
    go.addEventListener("click", () => continueConversation(r.conversation, go));
    el.append(go);

    list.append(el);
    oldest = r.id;
  }
  more.hidden = rows.length < 30;
}

function metaLine(r) {
  const n = (x) => (x || 0).toLocaleString("ko-KR");
  return `${r.model} · 입력 ${n(r.input_tokens)} · 캐시 읽기 ${n(r.cache_read_tokens)} · 캐시 쓰기 ${n(r.cache_write_tokens)} · 출력 ${n(r.output_tokens)} 토큰 · 약 $${(Number(r.cost_usd) || 0).toFixed(3)}`;
}

// 그 대화를 처음부터 불러와 질문 화면에 넘기고, 거기서 이어서 묻는다.
async function continueConversation(id, button) {
  button.disabled = true;
  try {
    const res = await fetch(`/api/records?conversation=${encodeURIComponent(id)}`, { headers: { "x-access-code": code || "" } });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `서버 오류(${res.status})예요.`);
    const turns = [];
    for (const r of data.rows) {
      turns.push({ role: "user", text: r.question || "", hadImage: r.has_image || 0 });
      turns.push({
        role: "assistant",
        text: r.answer,
        meta: r.status === "stopped" ? "중간에 멈춘 답이에요." : r.model ? metaLine(r) : "",
      });
    }
    if (!turns.length) throw new Error("이 대화를 불러오지 못했어요.");
    store.set("mt-chat", JSON.stringify({ conversation: id, turns }));
    location.href = "/";
  } catch (err) {
    errorLine.textContent = err.message;
    errorLine.hidden = false;
    button.disabled = false;
  }
}

more.addEventListener("click", async () => {
  more.disabled = true;
  try {
    const rows = await load(oldest);
    if (rows) showRows(rows);
  } catch (err) {
    errorLine.textContent = err.message;
    errorLine.hidden = false;
  } finally {
    more.disabled = false;
  }
});

(async () => {
  if (!code) return location.replace("/");
  try {
    const rows = await load();
    if (!rows) return;
    if (!rows.length) list.innerHTML = `<p class="empty">아직 지난 질문이 없어요.</p>`;
    else showRows(rows);
  } catch (err) {
    errorLine.textContent = err.message;
    errorLine.hidden = false;
  }
})();
</script>
</body>
</html>
