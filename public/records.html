<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>질문 기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="/style.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" onload="rerenderAll()"></script>
<style>
  .summary { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .item { border-bottom: 1px solid var(--line); padding: 16px 0; }
  .item-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .item-q { font-size: 16px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 8px; }
  .item details summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-bottom: 8px; }
  .item .answer { font-size: 16px; }
  .bad { color: var(--err); }
  .more { display: block; margin: 20px auto; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>질문 기록</h1>
    <a class="ghost" href="/" style="text-decoration:none">질문 화면</a>
  </div>
</header>

<section id="gate" class="gate" hidden>
  <form id="gate-form">
    <label for="code">관리자 코드</label>
    <input id="code" type="password" autocomplete="off" required>
    <button type="submit">열기</button>
    <div id="gate-error" class="error-line" hidden></div>
  </form>
</section>

<main id="page" hidden>
  <p id="summary" class="summary"></p>
  <div id="list"></div>
  <button id="more" class="ghost more" type="button" hidden>더 보기</button>
</main>

<script src="/render.js"></script>
<script>
const KEY = "mt-admin";
const list = document.getElementById("list");
const more = document.getElementById("more");
let code = store.get(KEY);
let oldest = null;

const STATUS = { done: "", pending: "답 쓰는 중", cut: "중간에 끊김", stopped: "학생이 멈춤", refused: "답 거절", error: "오류" };

function kst(utc) {
  return new Date(utc.replace(" ", "T") + "Z").toLocaleString("ko-KR", {
    timeZone: "Asia/Seoul", month: "numeric", day: "numeric", weekday: "short", hour: "2-digit", minute: "2-digit",
  });
}
const usd = (x) => "$" + (Number(x) || 0).toFixed(3);

async function load(before) {
  const res = await fetch("/api/records" + (before ? `?before=${before}` : ""), { headers: { "x-access-code": code } });
  if (res.status === 401) throw new Error("bad_code");
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `오류 ${res.status}`);
  return data;
}

function showRows(rows) {
  for (const r of rows) {
    const el = document.createElement("article");
    el.className = "item";
    const head = document.createElement("div");
    head.className = "item-head";
    head.innerHTML =
      `<span>${kst(r.created_at)}</span>` +
      (r.who === "admin" ? `<span class="chip">내 시험</span>` : "") +
      (r.has_image ? `<span class="chip">사진${r.has_image > 1 ? ` ${r.has_image}장` : ""}</span>` : "") +
      (STATUS[r.status] ? `<span class="bad">${STATUS[r.status]}</span>` : "");
    el.append(head);

    const q = document.createElement("div");
    q.className = "item-q";
    q.textContent = r.question || "(사진만 보냄)";
    el.append(q);

    if (r.answer) {
      const d = document.createElement("details");
      d.innerHTML = "<summary>답 보기</summary>";
      const a = document.createElement("div");
      a.className = "answer";
      d.append(a);
      d.addEventListener("toggle", () => { if (d.open && !a.innerHTML) paint(a, r.answer); });
      el.append(d);
    }

    if (r.model) {
      const m = document.createElement("div");
      m.className = "meta";
      const n = (x) => (x || 0).toLocaleString("ko-KR");
      m.textContent = `${r.model} · 입력 ${n(r.input_tokens)} · 캐시 읽기 ${n(r.cache_read_tokens)} · 캐시 쓰기 ${n(r.cache_write_tokens)} · 출력 ${n(r.output_tokens)} 토큰 · ${usd(r.cost_usd)}`;
      el.append(m);
    }
    list.append(el);
    oldest = r.id;
  }
  more.hidden = rows.length < 30;
}

async function open() {
  try {
    const { rows, summary } = await load();
    // 학생 코드로도 기록 API 는 열리지만, 이 페이지는 관리자만 쓴다
    if (!summary) throw new Error("bad_code");
    document.getElementById("gate").hidden = true;
    document.getElementById("page").hidden = false;
    const s = summary;
    document.getElementById("summary").textContent =
      `오늘 학생 질문 ${s.todayStudent}${s.limit ? ` / ${s.limit}` : "개"} · 오늘 ${usd(s.todayCost)} · 이번 달 ${usd(s.monthCost)}`;
    list.innerHTML = "";
    showRows(rows);
    if (!rows.length) list.textContent = "아직 질문이 없어요.";
  } catch (err) {
    store.remove(KEY);
    showGate(err.message === "bad_code" ? (code ? "관리자 코드가 맞지 않아요." : "") : err.message);
  }
}

function showGate(message) {
  document.getElementById("page").hidden = true;
  document.getElementById("gate").hidden = false;
  const e = document.getElementById("gate-error");
  e.textContent = message || "";
  e.hidden = !message;
  document.getElementById("code").focus();
}

document.getElementById("gate-form").addEventListener("submit", (e) => {
  e.preventDefault();
  code = document.getElementById("code").value.trim();
  store.set(KEY, code);
  open();
});

more.addEventListener("click", async () => {
  more.disabled = true;
  try { showRows((await load(oldest)).rows); } finally { more.disabled = false; }
});

if (code) open(); else showGate("");
</script>
</body>
</html>
