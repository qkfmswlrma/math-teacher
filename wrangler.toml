name = "math-teacher"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# 질문 기록과 하루 질문 수를 세는 DB.
# 배포할 때 Cloudflare 에서 만든 D1 의 진짜 id 로 바꾼다.
[[d1_databases]]
binding = "DB"
database_name = "math-teacher"
database_id = "00000000-0000-0000-0000-000000000000"

# 비밀이 아닌 설정만 여기 둔다.
# 비밀값(ANTHROPIC_API_KEY, ACCESS_CODE, ADMIN_CODE)은 Cloudflare 대시보드의 비밀값에,
# 내 컴퓨터에서는 .dev.vars 에 넣는다.
[vars]
DAILY_LIMIT = "30"
