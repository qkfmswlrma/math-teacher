name = "math-teacher"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# 질문 기록과 하루 질문 수를 세는 DB. 표는 서버 함수가 처음 쓸 때 만든다.
[[d1_databases]]
binding = "DB"
database_name = "math-teacher"
database_id = "67c8f7e5-be4e-496a-9f4d-fa3dde9a2f3d"

# 비밀값(ANTHROPIC_API_KEY, ACCESS_CODE, ADMIN_CODE)은 Cloudflare 대시보드의 비밀값에,
# 내 컴퓨터에서는 .dev.vars 에 넣는다.
# 학생의 하루 질문 수를 다시 제한하려면 아래 두 줄의 # 을 지우고 숫자를 넣는다. 지금은 제한 없음.
# [vars]
# DAILY_LIMIT = "30"
